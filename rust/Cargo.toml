[workspace]
resolver = "2"
members = [
    "crates/ess-parser",
    "crates/esm-parser",
    "crates/esm-ffi",
    "crates/plugin-parser",
    "crates/plugin-ffi",
    "crates/assets-core",
    "crates/assets-ffi",
    "crates/bsa-core",
    "crates/bsa-ffi",
    "crates/nif-core",
    "crates/nif-ffi",
    "crates/dds-core",
    "crates/dds-ffi",
    "crates/vm-handlers",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
pelite = "0.10"
capstone = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scroll = "0.12"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
