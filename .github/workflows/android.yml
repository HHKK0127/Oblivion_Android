name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The launcher icons are generated from the in-game loading symbol texture rather
      # than committed by hand. Android Studio's new-project template has silently
      # replaced them with the default green robot before, so fail early when the
      # committed PNGs drift from what scripts/generate_launcher_icons.py produces.
      # That texture is a gitignored Bethesda asset, so this runner has no copy of it
      # and the check falls back to the committed sha256 manifest in
      # scripts/launcher_icon_manifest.json.
      - name: Verify launcher icons
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          python3 scripts/generate_launcher_icons.py --check

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=21, so the daemon JVM
      # criteria cannot be satisfied by JDK 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK, but android-actions/setup-android@v3 is
      # unusable: it runs "sdkmanager tools" and the "tools" package no longer exists in
      # the SDK repository, which fails the step. Locate the preinstalled cmdline-tools
      # instead and put sdkmanager on PATH.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # Versions must stay in sync with compileSdk/ndkVersion in app/build.gradle and with
      # the CMake version AGP expects; AGP 8.5 will not fall back to a different one.
      - name: Install SDK packages, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      # Since the 2026-11-09 vendoring the six C ABI Rust crates behind the
      # native shims live in-repo under rust/, and CMake builds them through
      # cargo-ndk. Without a Rust toolchain + cargo-ndk the build fails at
      # configure with "cargo-ndk was not found" (run 42594828435). The target
      # list matches OBLIVION_RUST_TRIPLE in app/src/main/cpp/CMakeLists.txt
      # (arm64-v8a / armeabi-v7a / x86_64 are the ABIs this project builds).
      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version consistency
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          VERSION_CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle)
          # versionName is decoupled from versionCode: versionName changes only
          # when a Release tag is cut, while versionCode must increase
          # monotonically. Enforce a floor instead of a derived equality, so an
          # install never regresses below the internal baseline (was 910).
          FLOOR=1000
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE floor=$FLOOR"
          if [ "$VERSION_CODE" -lt "$FLOOR" ]; then
            echo "::error::versionCode $VERSION_CODE is below the floor $FLOOR"
            exit 1
          fi
          if ! printf '%s' "$VERSION_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::versionName '$VERSION_NAME' is not MAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "APK size: $(( $(stat -c%s "$APK") / 1024 / 1024 )) MiB"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  host-tests:
    name: Native C++ host tests
    runs-on: ubuntu-latest
    # 85 translation units at -O2 are compiled and linked in a single g++
    # invocation, so the compile is sequential and does not benefit from the
    # runner's core count. Measured end to end: 9m42s to 12m15s on
    # Windows/MinGW and 8m05s under WSL (g++ 13.3.0). 15 minutes was too close
    # to the slow end; 30 leaves real headroom.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # assets/esm_reader.cpp and assets/bsa_reader.cpp include <zlib.h> and link
      # with -lz, so the dev headers must be present. Installing an already
      # installed package is a no-op; this only removes the dependency on the
      # runner image happening to ship them.
      - name: Ensure zlib development headers
        run: sudo apt-get install -y --no-install-recommends zlib1g-dev

      # run_host_tests.sh compiles against the FFI headers vendored under
      # rust/crates/*/include and links the host-triple archives, but it only
      # *searches* for archives - it never builds them. Build the six ffi
      # crates in release mode first so the script finds them under
      # rust/target/release.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust FFI host archives
        working-directory: rust
        run: cargo build --release -p assets-ffi -p bsa-ffi -p plugin-ffi -p esm-ffi -p nif-ffi -p dds-ffi

      - name: Run native host tests
        run: bash tools/host_tests/run_host_tests.sh

  # V688a の代替（A 案）: エミュレータを捨て、host レベルの newgame smoke を
  # 固定フィクスチャ ESM（docs/evidence/fixtures/minimal.esm）で回す。
  # 決定性は同一ジョブ内の 2 回実行 diff で証明し、golden は CI（linux-gnu）で
  # 採取する（手元 Windows の MSVC 産は混ぜない）。golden は採取済み
  # （docs/evidence/golden/newgame-no-esm.json）なので blocking。
  smoke-host:
    name: New game host smoke (fixture ESM)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # run_host_tests.sh/run_smoke.sh compile against <zlib.h> and link -lz.
      - name: Ensure zlib development headers
        run: sudo apt-get install -y --no-install-recommends zlib1g-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # run_smoke.sh reuses run_host_tests.sh's discovery: it *searches* for the
      # host-triple archives, so build the six ffi crates first.
      - name: Build Rust FFI host archives
        working-directory: rust
        run: cargo build --release -p assets-ffi -p bsa-ffi -p plugin-ffi -p esm-ffi -p nif-ffi -p dds-ffi

      # Determinism: two runs must produce byte-identical JSON (fixed RNG seed,
      # no clock, relative paths). A non-zero diff stops the golden collection.
      - name: Run host smoke twice (determinism)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/host_tests/run_smoke.sh > out1.json
          bash tools/host_tests/run_smoke.sh > out2.json
          if ! diff -u out1.json out2.json; then
            echo "::error::host smoke output differs between two runs (non-deterministic)"
            exit 1
          fi
          echo "determinism OK: two runs identical"

      - name: Show smoke output
        shell: bash
        run: cat out1.json

      - name: Upload smoke output
        uses: actions/upload-artifact@v4
        with:
          name: newgame-smoke-json
          path: out1.json
          retention-days: 14

      - name: Compare against the golden
        shell: bash
        run: |
          python3 scripts/compare_golden.py out1.json --require \
            --golden docs/evidence/golden/newgame-no-esm.json

  # 未マージブランチを最終コミット日で active / 中間 / stale に分けて可視化する
  # （docs/claims.md の WIP 上限）。一律に数えると「多すぎる」しか言えないが、
  # 分けると「どれが生きていてどれが死んでいるか」が出る。律速は人間の注意と
  # マージ帯域。
  #
  # 判定は active（直近 7 日）のみの二段しきい値: warn 5 / block 10。warn は警告
  # のみ（exit 0）、block は exit 1 で止める。stale（30 日超）は件数と一覧を常に
  # 出す（黙らせない）。active が 5 以下に落ちたら block を 5 へ下げる（ラチェット）。
  #
  # 注意: CI の fresh clone は origin の枝しか見ないため、未 push の WIP は
  # ここに出ない（CI の active は 0 になり、block は実質ローカル実行で効く）。
  wip-limit:
    name: WIP limit (unmerged branches)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 未マージ判定には他ブランチの ref が要る。既定の checkout は単一 ref の
      # 浅い取得なので、全ブランチを取り直す。
      - name: Fetch all branches
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Check unmerged branch count
        run: python3 scripts/check_wip_limit.py --base origin/master --limit 5 --block-limit 10 --overlap

  # 実物 NIF fixture でブロック型被覆ゲートを回す。fixture は
  # docs/evidence/fixtures/nif/（Oblivion - Meshes.bsa の最小抜粋・型被覆用）。
  # ゲート値は fixture 側の実測（119 型 / 58 files）。B 全体（8032 files）での計測は
  # ローカルで回し、CI の数字と混ぜない。詳細は docs/evidence/fixtures/nif/README.md。
  nif-coverage:
    name: NIF block-type coverage (fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check NIF block-type coverage
        run: |
          set -euo pipefail
          python3 scripts/nif_coverage.py --corpus docs/evidence/fixtures/nif \
            --expect-corpus-types 119 --expect-corpus-files 58 \
            --min-impl 119 --max-missing 0 --max-stray 0

  # 実物 NIF fixture をオラクル（dump_rust）に通し、コミット済み期待値（元 C++ パーサ
  # dump_orig の出力、docs/evidence/fixtures/nif/oracle/）と 1 バイト比較する。harness は
  # scripts/build_nif_oracle.sh が tools/nif_oracle/ の driver から作る（ローカルの
  # out_rust は使わない）。不一致は exit 2。
  nif-oracle:
    name: NIF oracle (fixture vs expected dumps)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Rust std は MinGW で zlib を使う経路があるため、ホストビルドに zlib を用意する。
      - name: Ensure zlib development headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the oracle harness
        run: bash scripts/build_nif_oracle.sh

      - name: Check dump_rust against the committed expected dumps
        run: python3 scripts/nif_oracle_check.py

      # 型被覆（オラクル検証済み型数）も同じジョブで回す。--min-oracle は
      # oracle_types ∩ corpus_types なので 20（NiKeyframeController は oracle に居るが
      # コーパス外）。`if: always()` は、上の dump 比較が落ちてもこちらを走らせて
      # 片方の失敗がもう片方を隠さないようにするため。
      - name: Check oracle-verified type coverage (fixture oracle)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/nif_coverage.py --corpus docs/evidence/fixtures/nif \
            --oracle docs/evidence/fixtures/nif/oracle \
            --expect-corpus-types 119 --expect-corpus-files 58 \
            --min-impl 119 --max-missing 0 --max-stray 0 --min-oracle 20

  # 既定経路の実機検証（headless emulator）。build が作った APK を起動し、
  # スモーク（docs/smoke-tests/newgame.sh）とゴールデン比較
  # （scripts/compare_golden.py）を通す。2026-11 の停滞の主因は「既定経路の
  # 実機検証が 0」だったので、これを完了条件に含める。
  #
  # V688a park: hosted runner に hypervisor が無く emulator が起動しない
  # （ubuntu=KVM 無し / macOS arm64=HVF 無し / TCG=adb に登録されず）。
  # 代替は host smoke（smoke-host ジョブ・A 案）で、そちらが blocking。
  # このジョブは self-hosted runner（KVM/HVF あり）が用意できたら再開するため残す。
  smoke:
    name: Default path smoke (headless emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 45 分かかる headless スモーク。emulator が runner で起動しない間は push ごとに
    # 走らせない（workflow_dispatch / pull_request のみ）＋ warn-only。
    if: github.event_name != 'push'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: dist

      # 明示的に `app-debug.apk` を渡す。artifact 名がずれると「LOG を待ち続けて
      # 180s で失敗」という分かりにくい形になるため、先に存在を検査する。
      - name: Verify the APK artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app-debug.apk || {
            echo "::error::dist/app-debug.apk がありません（artifact 名 'app-debug' を確認）"
            ls -R dist || true
            exit 1
          }

      # compare_golden.py は Pillow/numpy を使う（launcher icon 検査と同じ依存）。
      # macOS の python3 は PEP 668（externally-managed）なので --break-system-packages。
      - name: Install Python imaging deps
        shell: bash
        run: python3 -m pip install --break-system-packages --quiet --disable-pip-version-check pillow numpy

      # V688a park: hypervisor 不在（ubuntu=KVM 無し / macOS arm64=HVF 無し / TCG=adb に登録されず）。
      # emulator は hosted runner では動かない。代替は host smoke（smoke-host ジョブ、A 案）。
      - name: Emulator smoke test (default path)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            bash docs/smoke-tests/newgame.sh dist/app-debug.apk

      - name: Compare against the golden image
        shell: bash
        run: |
          python3 scripts/compare_golden.py artifacts/smoke-newgame.png \
            --require --diff artifacts/smoke-newgame.diff.png

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-newgame
          path: |
            artifacts/smoke-newgame.png
            artifacts/smoke-newgame.log
            artifacts/smoke-newgame.diff.png
          retention-days: 14
