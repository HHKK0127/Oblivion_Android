name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The launcher icons are generated from the in-game loading symbol texture rather
      # than committed by hand. Android Studio's new-project template has silently
      # replaced them with the default green robot before, so fail early when the
      # committed PNGs drift from what scripts/generate_launcher_icons.py produces.
      # That texture is a gitignored Bethesda asset, so this runner has no copy of it
      # and the check falls back to the committed sha256 manifest in
      # scripts/launcher_icon_manifest.json.
      - name: Verify launcher icons
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          python3 scripts/generate_launcher_icons.py --check

      # gradle/gradle-daemon-jvm.properties pins toolchainVersion=21, so the daemon JVM
      # criteria cannot be satisfied by JDK 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK, but android-actions/setup-android@v3 is
      # unusable: it runs "sdkmanager tools" and the "tools" package no longer exists in
      # the SDK repository, which fails the step. Locate the preinstalled cmdline-tools
      # instead and put sdkmanager on PATH.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print -quit || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      # Versions must stay in sync with compileSdk/ndkVersion in app/build.gradle and with
      # the CMake version AGP expects; AGP 8.5 will not fall back to a different one.
      - name: Install SDK packages, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify version consistency
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)
          VERSION_CODE=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          EXPECTED=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE expected=$EXPECTED"
          if [ "$VERSION_CODE" != "$EXPECTED" ]; then
            echo "::error::versionCode $VERSION_CODE does not match versionName $VERSION_NAME (expected $EXPECTED)"
            exit 1
          fi

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "APK size: $(( $(stat -c%s "$APK") / 1024 / 1024 )) MiB"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
